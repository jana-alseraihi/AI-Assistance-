<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECM Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@300;400;700&family=Noto+Sans+Arabic:wght@300;400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="brand-name">ECM</div>
      <div class="brand-sub" data-i18n="brandSub">Enterprise Content Management</div>
    </div>
    <div class="top-tools">
      <button class="round-btn" type="button" aria-label="Help">?</button>
      <button class="round-btn plain" type="button" aria-label="Home">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 3 2 12h3v8h5v-6h4v6h5v-8h3L12 3Z"/></svg>
      </button>
    </div>
    <div class="topbar-actions">
      <label class="search">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.41 1.4-5.4-5.39A8 8 0 1 1 10 2Zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z"/></svg>
        <input id="searchInput" type="search" data-i18n-placeholder="searchPlaceholder" placeholder="Search documents">
      </label>
      <span class="mode-badge" id="modeBadge"></span>
      <button class="lang-btn" id="langBtn" type="button">العربية</button>
      <span class="avatar" aria-hidden="true">JA</span>
      <!-- Put the official company logo at assets/logo.png (or .svg and change the src). Hidden until the file exists. -->
      <img class="company-logo" src="assets/logo.png" alt="Company logo" hidden onload="this.hidden=false">
    </div>
  </header>

  <nav class="breadcrumb" aria-label="Breadcrumb">
    <span data-i18n="crumbHome">Enterprise</span><span class="sep">/</span>
    <span data-i18n="crumbArchive">Company Documents</span><span class="sep">/</span>
    <strong id="crumbCurrent"></strong>
  </nav>

  <main class="main">
    <div class="folder-bar">
      <svg class="filter-icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3 4h18l-7 8.5V19l-4 2v-8.5L3 4Z"/></svg>
      <label class="folder-title">
        <svg viewBox="0 0 24 24" width="30" height="30" aria-hidden="true"><path fill="#e8913a" d="M3 6a2 2 0 0 1 2-2h4.5l2 2H19a2 2 0 0 1 2 2v1H3V6Z"/><path fill="#f5a94a" d="M3 9h18v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9Z"/></svg>
        <select id="categorySelect" aria-label="Folder"></select>
        <svg class="chev" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M7 9l5 5 5-5H7Z"/></svg>
      </label>
      <span></span>
    </div>

    <table class="doc-table">
      <thead>
        <tr>
          <th class="c-check"><span class="checkbox" aria-hidden="true"></span></th>
          <th class="c-icon"></th>
          <th class="c-name"><span data-i18n="colName">Name</span> <span class="sort">↑</span></th>
          <th class="c-size" data-i18n="colSize">Size</th>
          <th class="c-date" data-i18n="colModified">Modified</th>
          <th class="c-star"></th>
        </tr>
      </thead>
      <tbody id="docRows"></tbody>
    </table>
    <p class="empty" id="emptyMsg" hidden></p>
  </main>

  <!-- Document viewer -->
  <dialog class="viewer" id="viewer">
    <div class="viewer-head">
      <div>
        <div class="doc-id" id="viewerId"></div>
        <h2 id="viewerTitle"></h2>
        <div class="meta" id="viewerMeta"></div>
      </div>
      <button class="icon-btn" id="viewerClose" type="button" aria-label="Close">✕</button>
    </div>
    <div class="viewer-body" id="viewerBody"></div>
    <div class="viewer-foot">
      <button class="primary-btn" id="askAboutBtn" type="button" data-i18n="askAbout">Ask the assistant about this document</button>
    </div>
  </dialog>

  <!-- Chat assistant -->
  <button class="chat-fab" id="chatFab" type="button" aria-label="Open assistant">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M12 3c5 0 9 3.6 9 8s-4 8-9 8c-1 0-2-.1-2.9-.4L4 20.5l1.4-4A7.6 7.6 0 0 1 3 11c0-4.4 4-8 9-8Zm-4 7a1.2 1.2 0 1 0 0 2.4A1.2 1.2 0 0 0 8 10Zm4 0a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4Zm4 0a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4Z"/></svg>
  </button>

  <section class="chat" id="chat" aria-label="AI assistant" hidden>
    <div class="chat-head">
      <div>
        <div class="chat-title" data-i18n="assistantName">Document Assistant</div>
        <div class="chat-sub" data-i18n="assistantSub">Answers from your ECM documents</div>
      </div>
      <div class="chat-head-actions">
        <button class="icon-btn" id="chatReset" type="button" data-i18n-title="newChat" title="New chat">↺</button>
        <button class="icon-btn" id="chatClose" type="button" aria-label="Close">✕</button>
      </div>
    </div>
    <div class="chat-log" id="chatLog" aria-live="polite"></div>
    <div class="suggestions" id="suggestions"></div>
    <form class="chat-form" id="chatForm">
      <textarea id="chatInput" rows="1" data-i18n-placeholder="inputPlaceholder" placeholder="Ask about any document…"></textarea>
      <button class="send-btn" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3 20.5 21 12 3 3.5l.01 6.6L15 12 3.01 13.9 3 20.5Z"/></svg>
      </button>
    </form>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>

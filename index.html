<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ECM Portal — AI Assistant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M6 2h8l6 6v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2Zm7 1.5V9h5.5L13 3.5Z"/></svg>
      </span>
      <span data-i18n="brand">ECM Portal</span>
    </div>
    <div class="topbar-actions">
      <span class="mode-badge" id="modeBadge"></span>
      <button class="ghost-btn" id="langBtn" type="button">العربية</button>
    </div>
  </header>

  <div class="layout">
    <nav class="sidebar" id="categoryNav" aria-label="Categories"></nav>

    <main class="main">
      <div class="main-head">
        <div>
          <h1 data-i18n="libraryTitle">Document library</h1>
          <p class="muted" data-i18n="librarySub">Browse documents, or ask the assistant.</p>
        </div>
        <label class="search">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M10 2a8 8 0 0 1 6.32 12.9l5.39 5.4-1.41 1.4-5.4-5.39A8 8 0 1 1 10 2Zm0 2a6 6 0 1 0 0 12 6 6 0 0 0 0-12Z"/></svg>
          <input id="searchInput" type="search" data-i18n-placeholder="searchPlaceholder" placeholder="Search documents">
        </label>
      </div>
      <div class="doc-grid" id="docGrid"></div>
    </main>
  </div>

  <!-- Document viewer -->
  <dialog class="viewer" id="viewer">
    <div class="viewer-head">
      <div>
        <div class="doc-id" id="viewerId"></div>
        <h2 id="viewerTitle"></h2>
        <div class="meta" id="viewerMeta"></div>
      </div>
      <button class="icon-btn" id="viewerClose" type="button" aria-label="Close">✕</button>
    </div>
    <div class="viewer-body" id="viewerBody"></div>
    <div class="viewer-foot">
      <button class="primary-btn" id="askAboutBtn" type="button" data-i18n="askAbout">Ask the assistant about this document</button>
    </div>
  </dialog>

  <!-- Chat assistant -->
  <button class="chat-fab" id="chatFab" type="button" aria-label="Open assistant">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true"><path fill="currentColor" d="M12 3c5 0 9 3.6 9 8s-4 8-9 8c-1 0-2-.1-2.9-.4L4 20.5l1.4-4A7.6 7.6 0 0 1 3 11c0-4.4 4-8 9-8Zm-4 7a1.2 1.2 0 1 0 0 2.4A1.2 1.2 0 0 0 8 10Zm4 0a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4Zm4 0a1.2 1.2 0 1 0 0 2.4 1.2 1.2 0 0 0 0-2.4Z"/></svg>
  </button>

  <section class="chat" id="chat" aria-label="AI assistant" hidden>
    <div class="chat-head">
      <div>
        <div class="chat-title" data-i18n="assistantName">Document Assistant</div>
        <div class="chat-sub" data-i18n="assistantSub">Answers from your ECM documents</div>
      </div>
      <div class="chat-head-actions">
        <button class="icon-btn" id="chatReset" type="button" data-i18n-title="newChat" title="New chat">↺</button>
        <button class="icon-btn" id="chatClose" type="button" aria-label="Close">✕</button>
      </div>
    </div>
    <div class="chat-log" id="chatLog" aria-live="polite"></div>
    <div class="suggestions" id="suggestions"></div>
    <form class="chat-form" id="chatForm">
      <textarea id="chatInput" rows="1" data-i18n-placeholder="inputPlaceholder" placeholder="Ask about any document…"></textarea>
      <button class="send-btn" type="submit" aria-label="Send">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M3 20.5 21 12 3 3.5l.01 6.6L15 12 3.01 13.9 3 20.5Z"/></svg>
      </button>
    </form>
  </section>

  <script type="module" src="app.js"></script>
</body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Pelli">
  <defs>
    <radialGradient id="body" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset=".65" stop-color="#eef5fc"/>
      <stop offset="1" stop-color="#cfe2f5"/>
    </radialGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23a"/>
      <stop offset="1" stop-color="#f5b400"/>
    </linearGradient>
    <linearGradient id="brim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7bd12"/>
      <stop offset="1" stop-color="#e2a000"/>
    </linearGradient>
  </defs>

  <!-- shadow -->
  <ellipse cx="120" cy="226" rx="50" ry="7" fill="#13294b" opacity=".12"/>

  <!-- legs -->
  <rect x="97" y="190" width="17" height="32" rx="8.5" fill="#1d2f55"/>
  <rect x="126" y="190" width="17" height="32" rx="8.5" fill="#1d2f55"/>

  <!-- left arm (down) -->
  <path d="M60 146 C46 158 44 174 50 186" fill="none" stroke="#a9c9ea" stroke-width="10" stroke-linecap="round"/>
  <!-- right arm (waving) -->
  <path d="M178 128 C192 116 198 100 196 84" fill="none" stroke="#a9c9ea" stroke-width="10" stroke-linecap="round"/>
  <circle cx="196" cy="78" r="9" fill="#eef5fc" stroke="#a9c9ea" stroke-width="3"/>

  <!-- body -->
  <circle cx="120" cy="142" r="64" fill="url(#body)" stroke="#9fc3e7" stroke-width="3"/>
  <ellipse cx="94" cy="112" rx="16" ry="9" fill="#ffffff" opacity=".9" transform="rotate(-30 94 112)"/>

  <!-- face -->
  <ellipse cx="102" cy="138" rx="9" ry="12" fill="#14213d"/>
  <ellipse cx="138" cy="138" rx="9" ry="12" fill="#14213d"/>
  <circle cx="105" cy="133" r="3.4" fill="#ffffff"/>
  <circle cx="141" cy="133" r="3.4" fill="#ffffff"/>
  <circle cx="99.5" cy="143" r="1.6" fill="#ffffff" opacity=".8"/>
  <circle cx="135.5" cy="143" r="1.6" fill="#ffffff" opacity=".8"/>
  <ellipse cx="85" cy="156" rx="9" ry="5.5" fill="#f6a8b8" opacity=".75"/>
  <ellipse cx="155" cy="156" rx="9" ry="5.5" fill="#f6a8b8" opacity=".75"/>
  <path d="M106 159 Q120 172 134 159" fill="none" stroke="#14213d" stroke-width="5" stroke-linecap="round"/>

  <!-- hard hat -->
  <path d="M66 96 C66 46 174 46 174 96 Z" fill="url(#hat)"/>
  <path d="M80 92 C82 64 100 54 112 52" fill="none" stroke="#ffe680" stroke-width="5" stroke-linecap="round" opacity=".8"/>
  <rect x="115" y="40" width="10" height="20" rx="5" fill="#ffdc4d"/>
  <rect x="50" y="90" width="140" height="14" rx="7" fill="url(#brim)"/>
  <rect x="56" y="91.5" width="128" height="3" rx="1.5" fill="#ffe27a" opacity=".7"/>

</svg>

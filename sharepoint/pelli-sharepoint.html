<!--
  Pelli for classic SharePoint.
  1. Upload this file and Pelli's files (pelli.js, pelli.css, pelli.svg, pelli-avatar.svg)
     to ONE folder in your site's "Site Assets" library, named "Pelli".
  2. On your page: Edit page > Add a Web Part > Media and Content > Content Editor.
  3. Web part properties > Content Link: the address of this file, for example
     /sites/YourSite/SiteAssets/Pelli/pelli-sharepoint.html
  Nothing here connects to GitHub or any outside site: every file comes from your SharePoint site.
-->
<script>
(function () {
  // ---- Settings you can change -------------------------------------------------------
  // Folder that holds Pelli's files. By default: <this site>/SiteAssets/Pelli/
  var site = (window._spPageContextInfo && _spPageContextInfo.webServerRelativeUrl) || "";
  var folder = site.replace(/\/$/, "") + "/SiteAssets/Pelli/";

  var settings = {
    // Search only the page content, not the SharePoint ribbon and menus.
    scope: "#DeltaPlaceHolderMain",
    subtitle: { en: "Your SharePoint buddy", ar: "رفيقك في شيربوينت" },
    suggestions: {
      en: ["What can you do?", "Summarize this page", "What time is it?", "Give me a tip"],
      ar: ["وش تقدر تسوي؟", "لخص الصفحة", "كم الساعة؟", "عطني نصيحة"]
    }
  };
  // ------------------------------------------------------------------------------------

  if (window.__pelliLoaded) return;          // only once, even if the web part is added twice
  window.__pelliLoaded = true;
  window.PELLI_BASE = folder;                 // where Pelli finds its images

  var css = document.createElement("link");
  css.rel = "stylesheet";
  css.href = folder + "pelli.css";
  document.getElementsByTagName("head")[0].appendChild(css);

  var js = document.createElement("script");
  js.src = folder + "pelli.js";
  js.onload = function () {
    if (!document.querySelector(settings.scope)) settings.scope = null; // older SharePoint: search the whole page
    settings.lang = (document.documentElement.lang || "").toLowerCase().indexOf("ar") === 0 ? "ar" : "en";
    window.Pelli.init(settings);
  };
  js.onerror = function () {
    if (window.console) console.warn("Pelli: could not load " + js.src + ". Check the folder in pelli-sharepoint.html.");
  };
  document.getElementsByTagName("head")[0].appendChild(js);
})();
</script>
